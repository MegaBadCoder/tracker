services:
  backend:
    image: ${REGISTRY_URL}/alfy-backend:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/app/data
    networks:
      - app

  frontend:
    image: ${REGISTRY_URL}/alfy-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app

  alfy-mcp:
    image: ${REGISTRY_URL}/alfy-mcp:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - ALFY_API_BASE=http://backend:3002/api
      - MCP_HTTP_PORT=3003
    networks:
      - app
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - alfy-mcp
    networks:
      - app

volumes:
  bot-data:
  caddy-data:
  caddy-config:

networks:
  app:
