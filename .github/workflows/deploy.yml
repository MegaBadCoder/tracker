name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}
  BACKEND_IMAGE: ${{ secrets.REGISTRY_URL }}/alfy-backend
  FRONTEND_IMAGE: ${{ secrets.REGISTRY_URL }}/alfy-frontend
  MCP_IMAGE: ${{ secrets.REGISTRY_URL }}/alfy-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build & push backend
        run: |
          docker build -t $BACKEND_IMAGE:${{ github.sha }} -t $BACKEND_IMAGE:latest ./alfy-bot
          docker push $BACKEND_IMAGE --all-tags

      - name: Build & push frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_BOT_USERNAME=${{ secrets.BOT_USERNAME }} \
            -t $FRONTEND_IMAGE:${{ github.sha }} -t $FRONTEND_IMAGE:latest \
            ./alfy-bot-frontend
          docker push $FRONTEND_IMAGE --all-tags

      - name: Build & push alfy-mcp
        run: |
          docker build -t $MCP_IMAGE:${{ github.sha }} -t $MCP_IMAGE:latest ./alfy-mcp
          docker push $MCP_IMAGE --all-tags

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: ~/alfy

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BOT_TOKEN,JWT_SECRET,REGISTRY_URL,REGISTRY_USER,REGISTRY_PASSWORD,WEBAPP_URL,BOT_USERNAME,SMTP_ENV,S3_ENV
          script: |
            install -d ~/alfy
            append_env_block() {
              local block="$1" line
              [ -z "$block" ] && return 0
              while IFS= read -r line || [ -n "$line" ]; do
                case "$line" in
                  ''|'#'*) continue ;;
                  [A-Za-z_][A-Za-z0-9_]*=*)
                    printf '%s\n' "$line"
                    ;;
                  *)
                    echo "Invalid env line (expected KEY=value): $line" >&2
                    return 1
                    ;;
                esac
              done <<< "$block"
            }
            {
              printf 'BOT_TOKEN=%s\nJWT_SECRET=%s\nPORT=3002\nNODE_ENV=production\nENABLE_TELEGRAM=false\nREGISTRY_URL=%s\nWEBAPP_URL=%s\nBOT_USERNAME=%s\n' \
                "$BOT_TOKEN" "$JWT_SECRET" "$REGISTRY_URL" "$WEBAPP_URL" "$BOT_USERNAME"
              append_env_block "$SMTP_ENV"
              append_env_block "$S3_ENV"
            } > ~/alfy/.env
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
            cd ~/alfy
            docker compose pull
            docker compose up -d
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          # Multiline .env blocks (KEY=value per line). Copy sections from .env.example.
          SMTP_ENV: ${{ secrets.SMTP_ENV }}
          S3_ENV: ${{ secrets.S3_ENV }}
