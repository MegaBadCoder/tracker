name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}
  BACKEND_IMAGE: ${{ secrets.REGISTRY_URL }}/alfy-backend
  FRONTEND_IMAGE: ${{ secrets.REGISTRY_URL }}/alfy-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build & push backend
        run: |
          docker build -t $BACKEND_IMAGE:${{ github.sha }} -t $BACKEND_IMAGE:latest ./alfy-bot
          docker push $BACKEND_IMAGE --all-tags

      - name: Build & push frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_BOT_USERNAME=${{ secrets.BOT_USERNAME }} \
            -t $FRONTEND_IMAGE:${{ github.sha }} -t $FRONTEND_IMAGE:latest \
            ./alfy-bot-frontend
          docker push $FRONTEND_IMAGE --all-tags

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: ~/alfy

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BOT_TOKEN,JWT_SECRET,REGISTRY_URL,REGISTRY_USER,REGISTRY_PASSWORD,WEBAPP_URL,BOT_USERNAME,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,EMAIL_FROM
          script: |
            printf 'BOT_TOKEN=%s\nJWT_SECRET=%s\nPORT=3002\nNODE_ENV=production\nREGISTRY_URL=%s\nWEBAPP_URL=%s\nBOT_USERNAME=%s\nSMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_SECURE=%s\nSMTP_USER=%s\nSMTP_PASS=%s\nEMAIL_FROM=%s\n' \
              "$BOT_TOKEN" "$JWT_SECRET" "$REGISTRY_URL" "$WEBAPP_URL" "$BOT_USERNAME" "$SMTP_HOST" "$SMTP_PORT" "$SMTP_SECURE" "$SMTP_USER" "$SMTP_PASS" "$EMAIL_FROM" > ~/alfy/.env
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
            cd ~/alfy
            docker compose pull
            docker compose up -d
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
